[workspace]
resolver = "3"
members = ["crates/game", "crates/obs", "crates/replay"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1"
bzip2 = "0.6"
obws = { version = "0.15", features = ["events"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-stream = "0.1"
source2-demo = { version = "0.5.10", features = ["dota"] }
# HTTPS 用 Windows 自带的 SChannel（native-tls），与 dota2-game-helper2 一致，不带 rustls/ring
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
