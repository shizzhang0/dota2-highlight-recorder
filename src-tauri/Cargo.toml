[package]
name = "d2hr-app"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "桌面应用：选录像、选人、勾片段、录制"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
clips = { path = "../crates/clips" }
game = { path = "../crates/game" }
media = { path = "../crates/media" }
pipeline = { path = "../crates/pipeline" }
replay = { path = "../crates/replay" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# 录完或出错时弹系统通知
tauri-plugin-notification = "2"
# 同时只跑一个：第二次打开时把已有的窗口提到前面
tauri-plugin-single-instance = "2"
# 一键更新（只对安装版生效，见 updater.rs）。走系统代理，和前端检查更新一样
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
# 删除视频时移到回收站（SHFileOperationW）
windows.workspace = true
