<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota 2 高光录制</title>
<link rel="stylesheet" href="css/app.css">
<header class="topbar">
  <span class="brand"><span class="logo">D2</span><span data-t="app.title"></span></span>
  <nav class="nav">
    <button type="button" data-nav="home" data-t="nav.matches"></button>
    <button type="button" data-nav="videos" data-t="nav.videos"></button>
    <button type="button" data-nav="settings" data-t="nav.settings"></button>
  </nav>
  <div class="spacer"></div>
  <span class="recording-badge" id="recording-badge" hidden data-t="nav.recording"></span>
  <span class="game-status" id="game-status" hidden>
    <span data-t="nav.gameOpen"></span>
    <button type="button" class="link" id="quit-game" data-t="nav.quitGame"></button>
  </span>
</header>
<main id="view"></main>
<dialog id="settings"></dialog>
<dialog id="confirm"></dialog>
<script type="module" src="js/main.js"></script>
</html>
